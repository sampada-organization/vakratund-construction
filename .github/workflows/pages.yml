name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve public URL
        id: site
        run: |
          DOMAIN="${{ vars.PRODUCTION_DOMAIN }}"
          if [ -n "$DOMAIN" ]; then
            echo "url=https://${DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://sampada-organization.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/vakratund-construction/" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ steps.site.outputs.url }}
          ASTRO_BASE: ${{ steps.site.outputs.base }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
